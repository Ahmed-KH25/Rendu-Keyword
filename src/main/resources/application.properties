spring.application.name=Autoloc

# ===== Base H2 en memoire (par defaut, aucun serveur a installer) =====
# Les donnees sont perdues a chaque arret de l'application.
spring.datasource.url=jdbc:h2:mem:autoloc;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

# contextPath
server.servlet.context-path=/Autoloc

# Pour revenir a MySQL : lancer avec le profil "mysql"
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# (la configuration MySQL est dans application-mysql.properties)
